name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutor-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    name: Dominio y compilación (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias del lockfile
        run: npm ci --no-audit --fund=false
      - name: Ejecutar todas las pruebas de dominio
        run: npm test 2>&1 | tee domain-tests.log
      - name: Comprobar TypeScript y compilar
        run: npm run build
      - name: Guardar resultado de las pruebas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dominio-${{ matrix.os }}
          path: domain-tests.log
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: App Windows, Moodle, IA y pruebas del instalador
    needs: domain
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      electron_config_cache: ${{ github.workspace }}/.tools/electron-downloads
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias del lockfile
        run: npm ci --no-audit --fund=false
      - name: Recuperar descargas verificables
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: runtimes-windows-x64-${{ hashFiles('electron/*-config.ts', 'scripts/prepare-*.mjs', 'package-lock.json') }}
          path: |
            .tools/llama-runtime.zip
            .tools/electron-downloads
            .tools/vc_redist.x64.exe
            .tools/ocr-runtime
            .tools/semantic-runtime
            .tools/ai-test/models
            .tools/moodle-test/php.zip
            .tools/moodle-test/mariadb.zip
            .tools/pdf-check/*.zip
            .tools/pdf-check/*.whl
      - name: Instalar el ejecutable de Electron del lockfile
        run: node node_modules/electron/install.js
      - name: Compilar la aplicación
        run: npm run build
      - name: Preparar llama.cpp, OCR y búsqueda semántica
        run: npm run prepare:runtime
      - name: Preparar Moodle real con alumnos sintéticos
        run: node scripts/prepare-moodle-test.mjs
      - name: Preparar comprobación de PDF
        run: npm run prepare:pdf-check
      - name: Descargar y comprobar Qwen con inferencia local real
        run: node scripts/test-ai.mjs
      - name: Comprobar el conector contra Moodle real
        run: npm run test:moodle
      - name: Construir el instalador sin publicar una release
        run: npm run dist -- --publish never
      - name: Comprobar los 17 recorridos empaquetados y los PDF
        run: npm run test:release
      - name: Instalar, abrir y desinstalar la aplicación
        run: node scripts/smoke-installer.mjs
      - name: Guardar informes, registros y capturas sintéticas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pruebas-windows
          path: |
            test-results/*.json
            test-results/*.log
            test-results/*.png
            tmp/pdfs/*.pdf
            tmp/pdfs/*.png
          if-no-files-found: warn
          retention-days: 7
