name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutor-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    name: Domain and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify tag matches package version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; if (process.env.RELEASE_TAG !== "v" + JSON.parse(fs.readFileSync("package.json", "utf8")).version) process.exit(1);'
      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false
      - name: Audit dependency advisories
        run: npm audit --audit-level=moderate
      - name: Run all domain tests
        run: npm test 2>&1 | tee domain-tests.log
      - name: Check TypeScript and build
        run: npm run build
      - name: Store test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dominio-${{ matrix.os }}
          path: domain-tests.log
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Windows portable, Moodle and local AI checks
    needs: domain
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      electron_config_cache: ${{ github.workspace }}/.tools/electron-downloads
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false
      - name: Restore verifiable downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: runtimes-windows-x64-${{ hashFiles('electron/*-config.ts', 'scripts/prepare-*.mjs', 'package-lock.json') }}
          path: |
            .tools/llama-runtime.zip
            .tools/electron-downloads
            .tools/vc_redist.x64.exe
            .tools/ocr-runtime
            .tools/semantic-runtime
            .tools/ai-test/models
            .tools/moodle-test/php.zip
            .tools/moodle-test/mariadb.zip
            .tools/pdf-check/*.zip
            .tools/pdf-check/*.whl
      - name: Install the locked Electron executable
        run: node node_modules/electron/install.js
      - name: Build the application
        run: npm run build
      - name: Prepare llama.cpp, OCR and semantic search
        run: npm run prepare:runtime
      - name: Verify multi-course desktop workflow with synthetic REST responses
        run: npm run test:moodle:courses
      - name: Prepare real Moodle with synthetic learners
        run: node scripts/prepare-moodle-test.mjs
      - name: Prepare PDF checks
        run: npm run prepare:pdf-check
      - name: Download and verify Qwen with real local inference
        run: node scripts/test-ai.mjs
      - name: Verify connector against real Moodle
        run: npm run test:moodle
      - name: Build the portable ZIP without publishing
        run: npm run dist
      - name: Verify 25 packaged workflows, portable relocation and report PDFs
        run: npm run test:release
      - name: Prepare the verified portable download
        run: node scripts/prepare-distribution.mjs
      - name: Store portable ZIP, SHA-256 and verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portable-windows
          path: release/distribution/*
          if-no-files-found: error
          retention-days: 30
      - name: Store synthetic reports, logs and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pruebas-windows
          path: |
            test-results/*.json
            test-results/*.log
            test-results/*.png
            tmp/pdfs/*.pdf
            tmp/pdfs/*.png
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish portable ZIP to GitHub Releases
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [domain, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: portable-windows
          path: release/distribution
      - name: Verify artifact and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
